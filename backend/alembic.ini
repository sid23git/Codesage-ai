# Alembic configuration file.
# This file is read by Alembic when generating and applying migrations.
# The sqlalchemy.url value below is intentionally a placeholder — the
# actual URL is injected at runtime by alembic/env.py reading from
# application settings.  Do NOT hard-code credentials here.

[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder — overridden by env.py at runtime.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
