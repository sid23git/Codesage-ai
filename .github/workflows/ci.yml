name: CI

# Runs on every pull request and every push to main. No deployment, no
# image publishing, no tags/releases here -- this workflow's only job is
# to prove a change is tested, linted, type-checked, buildable, and
# migration-safe against a real Postgres+pgvector instance before it can
# be merged. Deployment automation is a separate, later phase.
on:
  pull_request:
  push:
    branches:
      - main

# Minimal, read-only token everywhere -- no job here needs to write to the
# repo, publish a package, or comment on a PR. Combined with `pull_request`
# (never `pull_request_target`), a fork PR's GITHUB_TOKEN is read-only and
# no repository secret is referenced anywhere in this file (every backend
# job below uses a hardcoded, non-secret CI-only test key and an ephemeral
# service-container database password -- see each job's `env:`), so
# there is nothing here a fork PR could exfiltrate even if it wanted to.
permissions:
  contents: read

# Cancel a still-running CI run for the same branch/PR once a newer commit
# supersedes it, instead of burning runner time on output nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A CI-only signing key -- never a real secret, never used outside this
# workflow's ephemeral runners. Backend jobs that invoke `alembic`
# directly (not through pytest) need it explicitly, since only pytest
# picks up tests/conftest.py's own equivalent fallback.
env:
  CI_SECRET_KEY: ci-pipeline-only-secret-key-never-used-anywhere-else-0000000000

jobs:
  # --------------------------------------------------------------------
  # Frontend: exactly the commands documented in frontend/README.md and
  # already run manually in every M7/M8 phase of this project.
  # --------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # matches frontend/Dockerfile's node:20-slim
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # --------------------------------------------------------------------
  # Backend unit tests: the normal, fast SQLite path -- ~420 tests, zero
  # external services, exactly `pytest` with no extra flags (same as
  # backend/README.md documents). This is NOT where Postgres-specific
  # correctness is proven -- see backend-postgres below for that.
  # --------------------------------------------------------------------
  backend-unit:
    name: Backend unit tests (SQLite fast path)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches backend/Dockerfile's python:3.12.7-slim
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      - run: pytest

  # --------------------------------------------------------------------
  # Backend Postgres/pgvector integration: the one job that answers "does
  # this actually work against real Postgres", not the SQLite
  # approximation. Uses the exact pgvector/pgvector:pg16 image adopted in
  # M8 Phase 1. TEST_DATABASE_URL is what tests/conftest.py's
  # `test_engine` fixture looks for to switch from `Base.metadata.
  # create_all` (SQLite) to real `alembic upgrade head` (Postgres) --
  # see that file's own module docstring.
  # --------------------------------------------------------------------
  backend-postgres:
    name: Backend Postgres + pgvector integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: codesage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_test -d codesage_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      SECRET_KEY: ${{ env.CI_SECRET_KEY }}
      DATABASE_URL: postgresql+asyncpg://ci_test:ci_test_password@localhost:5432/codesage_ci
      TEST_DATABASE_URL: postgresql+asyncpg://ci_test:ci_test_password@localhost:5432/codesage_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"

      # Fail loudly and immediately if the job's own database wiring is
      # ever broken by a future change, rather than letting the
      # retrieval tests below silently pass against nothing (or, worse,
      # silently fall back to SQLite without anyone noticing).
      - name: Guard -- TEST_DATABASE_URL must be set
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "::error::TEST_DATABASE_URL is not set -- refusing to run the Postgres integration job without a real database."
            exit 1
          fi
          echo "TEST_DATABASE_URL is set -- proceeding against the real Postgres service container."

      - name: Alembic upgrade head (fresh database)
        run: python -m alembic upgrade head

      - name: Alembic current revision
        run: python -m alembic current

      # Advisory, not blocking -- and expected to always report the same
      # fixed set of findings, by design, not by accident. `alembic
      # check` diffs the real database against Base.metadata (what the
      # ORM models actually declare), and this schema has two
      # permanent, deliberate divergences from that: (1) code_chunks'
      # `tsv_content` generated column and its HNSW/GIN indexes are
      # intentionally NOT mapped on the CodeChunk model (see that
      # model's own docstring -- they're raw-SQL-only, added directly
      # in migration 0004), and (2) the descriptive `comment=` kwargs on
      # several models' columns were never propagated into the
      # migrations as real `COMMENT ON COLUMN` DDL, so the live schema
      # has no comments to match against. Neither is a bug in any given
      # PR's migration changes, and "make alembic check pass" would mean
      # either remapping tsv_content (undoing a deliberate M5 design
      # decision) or retroactively rewriting historical migrations to
      # add comment DDL -- exactly what this phase's instructions say
      # not to do just to force a green result. The step still runs (and
      # its output stays visible in every job log) so a genuinely NEW,
      # unexpected divergence beyond this known baseline is still there
      # for a human to notice; only the job's pass/fail no longer
      # depends on it.
      - name: Alembic check (schema/model drift -- advisory, see comment above)
        continue-on-error: true
        run: python -m alembic check

      # Proves every migration's downgrade() path is real and that a
      # round trip lands back on an identical schema -- not just that
      # upgrade() happens to work once.
      - name: Alembic downgrade/upgrade roundtrip
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Alembic check after roundtrip (advisory, same baseline expected)
        continue-on-error: true
        run: python -m alembic check

      # Runs VectorRetriever and KeywordRetriever against the real
      # `<=>` pgvector operator and real `tsv_content @@
      # plainto_tsquery(...)` full-text search -- the two Postgres-only
      # code paths that have no automated coverage anywhere else (see
      # app/rag/retrieval/vector.py and keyword.py). The trailing test
      # in this file (test_retrieval_suite_is_actually_running_against_
      # postgres) asserts the session is genuinely bound to a
      # postgresql engine, so a future regression that silently routes
      # this job back onto SQLite fails here instead of passing quietly.
      #
      # test_rag_api.py is deliberately NOT run here: its TestClient-
      # based tests hit a documented, pre-existing test-harness
      # limitation against real asyncpg (TestClient's thread-portal
      # event loop vs. asyncpg's loop-affine connections -- see M8
      # Phase 1's report). That is a test-infrastructure limitation,
      # verified NOT to occur in the real running app (confirmed via a
      # live HTTP smoke test against the containerized backend), not a
      # gap in what this job actually proves about the retrieval layer.
      - name: Postgres retrieval tests (vector + keyword, real engine)
        run: pytest tests/test_rag_retrieval.py -v

  # --------------------------------------------------------------------
  # Dependency vulnerability audit. npm audit natively supports a
  # severity floor; pip-audit does not (no equivalent flag exists as of
  # this writing), so it runs as an advisory, non-blocking step -- see
  # its own comment below. GitHub's built-in secret scanning is a repo
  # Settings toggle, not something expressible here; see README.md.
  # --------------------------------------------------------------------
  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend -- install (runtime deps only, no dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install .

      # No severity-floor flag exists in pip-audit today, unlike `npm
      # audit --audit-level`, so this cannot fail the job only on
      # high-severity findings without also risking failure on
      # low-severity/dev-only advisories it can't distinguish. Reported,
      # not blocking, until pip-audit supports that natively.
      - name: Backend -- pip-audit (advisory, does not block CI)
        working-directory: backend
        continue-on-error: true
        run: pip-audit

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend -- npm ci
        working-directory: frontend
        run: npm ci

      - name: Frontend -- npm audit (high+ severity blocks CI)
        working-directory: frontend
        run: npm audit --audit-level=high

  # --------------------------------------------------------------------
  # Proves both Dockerfiles (M8 Phase 1) still build on every change.
  # Never pushes an image anywhere -- that's M8 Phase 3's concern.
  # --------------------------------------------------------------------
  docker-build:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: codesage-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: codesage-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
